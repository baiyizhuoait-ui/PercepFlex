data:
  root: data/bdd100k
model:
  detection:
    nc: 1
  encoder:
    blocks:
    - 2
    - 3
    - 3
    stages:
    - 64
    - 128
    - 192
    - 256
    stem: 32
  representation:
    z_channels: 128
  segmentation:
    hidden: 32
train:
  batch_size: 16
  epochs: 3
  lambda_budget: 0.0
  lambda_da: 1.0
  lambda_lane: 1.0
  lr: 1e-3
  num_workers: 2
  stage: A
  train_split: tri_train
  weight_decay: 5e-4
