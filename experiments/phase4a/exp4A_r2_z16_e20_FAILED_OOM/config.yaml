data:
  root: data/bdd100k
input_size:
- 640
- 640
model:
  detection:
    det_ch: 32
    from_z: true
    nc: 1
    z_proj: true
  encoder:
    blocks:
    - 2
    - 2
    - 2
    stages:
    - 32
    - 64
    - 96
    - 128
    stem: 16
  representation:
    z_channels: 16
  segmentation:
    hidden: 32
train:
  batch_size: 16
  epochs: 20
  grad_clip: 10.0
  lambda_budget: 0.0
  lambda_da: 1.0
  lambda_lane: 1.0
  lr: 1e-3
  num_workers: 2
  stage: A
  train_split: tri_train
  weight_decay: 5e-4
