data:
  root: data/bdd100k
model:
  budgets:
  - 0.25
  - 0.5
  - 1.0
  detection:
    nc: 1
  encoder:
    blocks:
    - 2
    - 2
    - 2
    stages:
    - 32
    - 64
    - 96
    - 128
    stem: 16
  representation:
    z_channels: 64
  router:
    shared: true
  segmentation:
    hidden: 32
train:
  batch_size: 16
  budget_mode: NONE
  budget_target: 0.5
  epochs: 1
  lambda_budget: 1.0
  lambda_da: 1.0
  lambda_lane: 1.0
  lr: 5e-4
  num_workers: 2
  stage: D
  train_split: tri_train
  weight_decay: 5e-4
