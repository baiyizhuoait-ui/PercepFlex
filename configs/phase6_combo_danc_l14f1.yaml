# Phase 6 EXP-04 / unified asymmetric candidate (H-32/L first brick):
# detection = k-means anchor assignment (validated: danc 20ep 0.4982/0.4960)
# lane      = 1/4 lateral refinement branch (validated: l14f1 20ep 0.5988, WEAK)
# DA        = untouched (saturated per Phase 3A/P4B-EXP-06)
# FLOPs expected ~= l14f1 (1.639G) since anchors are zero-cost.
model:
  encoder:
    stem: 16
    stages: [32, 64, 96, 128]
    blocks: [2, 2, 2]
  representation:
    z_channels: 16
  detection:
    nc: 1
    from_z: true
    z_proj: true
    det_ch: 32
    anchors:
      - [[9, 8], [18, 15], [32, 24]]
      - [[49, 38], [80, 52], [65, 102]]
      - [[124, 82], [166, 136], [237, 214]]
  segmentation:
    hidden: 32
    lane_res: 4
    lane_use_f1: true
input_size: [640, 640]
train:
  stage: A
  train_split: tri_train
  batch_size: 16
  num_workers: 2
  epochs: 4
  lr: 1e-3
  weight_decay: 5e-4
  lambda_da: 1.0
  lambda_lane: 1.0
  lambda_budget: 0.0
  grad_clip: 10.0
data:
  root: data/bdd100k
