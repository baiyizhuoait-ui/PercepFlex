model:
  encoder: {stem: 32, stages: [64, 128, 192, 256], blocks: [2, 3, 3]}
  representation: {z_channels: 128}
  detection: {nc: 1}
  segmentation: {hidden: 32}
train:
  stage: A
  train_split: tri_train
  batch_size: 16
  num_workers: 2
  epochs: 3
  lr: 1e-3
  weight_decay: 5e-4
  lambda_da: 1.0
  lambda_lane: 1.0
  lambda_budget: 0.0
data:
  root: data/bdd100k
