model:
  encoder:
    stem: 16
    stages:
    - 32
    - 64
    - 96
    - 128
    blocks:
    - 2
    - 2
    - 2
  representation:
    z_channels: 32
  detection:
    nc: 1
    from_z: true
    z_proj: true
    det_ch: 32
  segmentation:
    hidden: 32
input_size:
- 640
- 640
train:
  stage: A
  train_split: tri_train
  batch_size: 16
  num_workers: 2
  epochs: 20
  lr: 1e-3
  weight_decay: 5e-4
  lambda_da: 1.0
  lambda_lane: 1.0
  lambda_budget: 0.0
  grad_clip: 10.0
data:
  root: data/bdd100k
