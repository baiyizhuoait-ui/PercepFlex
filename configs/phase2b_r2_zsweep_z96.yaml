# Phase-2-B Task 2(c) RR2 — Detection reads Compact Z.
# R1 (z_proj=false): det consumes Z directly.  R2 (z_proj=true): det consumes Z after a
# 1x1 projection (the minimal information-allocation path under test).
# Compared against R0 (configs/phase2b_zsweep_z96.yaml, det from multi-scale encoder).
# Fixed Stage-A protocol: 4ep, bs16, AdamW lr1e-3, cosine, tri_train full, seed0.
model:
  encoder: {stem: 16, stages: [32, 64, 96, 128], blocks: [2, 2, 2]}
  representation: {z_channels: 96}
  detection: {nc: 1, from_z: true, z_proj: true}
  segmentation: {hidden: 32}
input_size: [640, 640]
train:
  stage: A
  train_split: tri_train
  batch_size: 16
  num_workers: 2
  epochs: 4
  lr: 1e-3
  weight_decay: 5e-4
  lambda_da: 1.0
  lambda_lane: 1.0
  lambda_budget: 0.0
  grad_clip: 10.0
data:
  root: data/bdd100k
