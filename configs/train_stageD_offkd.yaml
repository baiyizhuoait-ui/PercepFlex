model:
  encoder: {stem: 16, stages: [32, 64, 96, 128], blocks: [2, 2, 2]}
  representation: {z_channels: 64}
  detection: {nc: 1}
  segmentation: {hidden: 32}
  budgets: [0.25, 0.5, 1.0]
train:
  stage: D
  train_split: tri_train
  batch_size: 16
  num_workers: 2
  epochs: 2
  lr: 5e-4
  weight_decay: 5e-4
  lambda_da: 1.0
  lambda_lane: 1.0
  lambda_budget: 1.0
  budget_target: 0.5
  kd:
    teacher: YOLOP
    offline_cache: experiments/expF_single_teacher/kd_cache
    lambda_feat: 0.1
    lambda_out: 1.0
data:
  root: data/bdd100k
