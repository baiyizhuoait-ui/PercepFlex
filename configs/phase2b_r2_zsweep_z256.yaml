# Phase-2-B Task 2(c) — r2 @ z=256
# Detection reads Compact Z. R2 = through a 1x1 projection; R1 = Z used raw.
# Encoder FIXED at 0.235M geometry; ONLY representation.z_channels varies.
# det_ch FIXED at 32 so head capacity does not confound the Z sweep.
# z=256 upper bracket (model grows to ~0.417M, ~1.8x R0). Finds the capacity at which detection-through-Z breaks even, if it does at all.
# R0 reference at this z: no R0 point at this z (R0 sweep stopped at 128)
# Fixed Stage-A protocol: 4ep, bs16, AdamW lr1e-3, cosine, tri_train, seed0.
model:
  encoder: {stem: 16, stages: [32, 64, 96, 128], blocks: [2, 2, 2]}
  representation: {z_channels: 256}
  detection: {nc: 1, from_z: true, z_proj: true, det_ch: 32}
  segmentation: {hidden: 32}
input_size: [640, 640]
train:
  stage: A
  train_split: tri_train
  batch_size: 16
  num_workers: 2
  epochs: 4
  lr: 1e-3
  weight_decay: 5e-4
  lambda_da: 1.0
  lambda_lane: 1.0
  lambda_budget: 0.0
  grad_clip: 10.0
data:
  root: data/bdd100k
