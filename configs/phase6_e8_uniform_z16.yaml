# Phase 6B / EXP-08 A-uniform candidate.
# Uniform encoder width expansion from phase4a_r2_z16 (scale 1.40):
#   stem 16->24, stages [32,64,96,128] -> [48,88,136,176].
# Measured: 0.3339M params / 1.6650G FLOPs (+1.6% vs combo 1.6391G).
# Heads (det_ch 32, seg hidden 32) intentionally IDENTICAL to baseline -
# only the shared representation is uniformly expanded.
model:
  encoder:
    stem: 24
    stages: [48, 88, 136, 176]
    blocks: [2, 2, 2]
  representation:
    z_channels: 16
  detection:
    nc: 1
    from_z: true
    z_proj: true
    det_ch: 32
  segmentation:
    hidden: 32
input_size: [640, 640]
train:
  stage: A
  train_split: tri_train
  batch_size: 16
  num_workers: 2
  epochs: 20
  lr: 1e-3
  weight_decay: 5e-4
  lambda_da: 1.0
  lambda_lane: 1.0
  lambda_budget: 0.0
  grad_clip: 10.0
data:
  root: data/bdd100k
