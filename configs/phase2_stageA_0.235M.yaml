# Phase-2 fixed Stage-A protocol — 0.235M compact static (A0 reference)
# All Phase-2 A0..A9 rows share this protocol (epochs=4, bs16, AdamW 1e-3, cosine).
model:
  encoder: {stem: 16, stages: [32, 64, 96, 128], blocks: [2, 2, 2]}
  representation: {z_channels: 64}
  detection: {nc: 1}
  segmentation: {hidden: 32}
input_size: [640, 640]
train:
  stage: A
  train_split: tri_train
  batch_size: 16
  num_workers: 2            # train.py auto-raises to ~cores on CUDA
  epochs: 4
  lr: 1e-3
  weight_decay: 5e-4
  lambda_da: 1.0
  lambda_lane: 1.0
  lambda_budget: 0.0
  grad_clip: 10.0
data:
  root: data/bdd100k
