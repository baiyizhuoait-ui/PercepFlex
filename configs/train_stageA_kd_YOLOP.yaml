model:
  encoder: {stem: 16, stages: [32, 64, 96, 128], blocks: [2, 2, 2]}
  representation: {z_channels: 64}
  detection: {nc: 1}
  segmentation: {hidden: 32}
train:
  stage: A
  train_split: tri_train
  batch_size: 16
  num_workers: 2
  epochs: 6
  lr: 1e-3
  weight_decay: 5e-4
  lambda_da: 1.0
  lambda_lane: 1.0
  lambda_budget: 0.0
  kd:
    teacher: YOLOP
    preset: 
    lambda_feat: 0.1
    lambda_out: 0.2
    T: 3
data:
  root: data/bdd100k
