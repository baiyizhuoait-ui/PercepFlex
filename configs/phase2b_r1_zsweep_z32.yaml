# Phase-2-B Task 2(c) — r1 @ z=32
# Detection reads Compact Z. R2 = through a 1x1 projection; R1 = Z used raw.
# Encoder FIXED at 0.235M geometry; ONLY representation.z_channels varies.
# det_ch FIXED at 32 so head capacity does not confound the Z sweep.
# R1 at z=32 is the ONLY point where R1 is genuinely different from R2: with zc==det_ch==32 the entry conv is Identity, so Z feeds the pyramid raw. At any other z, R1 and R2 differ only by a BN+ReLU.
# R0 reference at this z: 0.203M, da_mIoU 0.8317, mAP50 0.2421
# Fixed Stage-A protocol: 4ep, bs16, AdamW lr1e-3, cosine, tri_train, seed0.
model:
  encoder: {stem: 16, stages: [32, 64, 96, 128], blocks: [2, 2, 2]}
  representation: {z_channels: 32}
  detection: {nc: 1, from_z: true, z_proj: false, det_ch: 32}
  segmentation: {hidden: 32}
input_size: [640, 640]
train:
  stage: A
  train_split: tri_train
  batch_size: 16
  num_workers: 2
  epochs: 4
  lr: 1e-3
  weight_decay: 5e-4
  lambda_da: 1.0
  lambda_lane: 1.0
  lambda_budget: 0.0
  grad_clip: 10.0
data:
  root: data/bdd100k
